server {
    listen 5173;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml font/woff2;
    gzip_min_length 256;

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # Frontend và backend phải cùng origin. Phiên đăng nhập nằm trong cookie HttpOnly, nên
    # gọi API sang origin khác (VITE_API_URL) sẽ kéo theo CORS + SameSite và cookie bị chặn.
    # Vì vậy nginx proxy /api và /storage về backend thay vì để frontend gọi tuyệt đối.
    #
    # Dùng resolver của Docker DNS (127.0.0.11) thay vì để nginx resolve upstream MỘT lần khi
    # khởi động. Không có nó, backend restart → nhận IP mới trong network → nginx vẫn giữ IP cũ
    # → mọi /api/* trả 502 "connection refused" cho tới khi frontend restart.
    # valid=5s khiến nginx hỏi lại DNS định kỳ, đón được IP mới sau ~5 giây.
    resolver 127.0.0.11 valid=5s;

    location /api/ {
        set $backend http://ai-backend:8000;
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (/api/stream/tasks/{id}): tiến độ phải tới trình duyệt ngay khi worker phát ra.
        # Buffer bật thì nginx gom sự kiện lại, thanh tiến độ đứng im rồi nhảy một lần cuối.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /storage/ {
        set $backend http://ai-backend:8000;
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /assets/ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /fontawesome/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
