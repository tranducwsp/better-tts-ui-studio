server {
    listen 5173;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml font/woff2;
    gzip_min_length 256;

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # Dùng resolver của Docker DNS (127.0.0.11) thay vì để nginx resolve upstream MỘT lần khi
    # khởi động. Trước đây backend restart → nhận IP mới trong network → nginx vẫn giữ IP cũ
    # (resolved lúc start) → mọi /api/* trả 502 "connection refused" cho tới khi frontend restart.
    # valid=5s khiến nginx hỏi lại DNS định kỳ, đón được IP mới sau ~5 giây mà không cần restart.
    resolver 127.0.0.11 valid=5s;

    location /api/ {
        set $backend http://ai-backend:8000;
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /storage/ {
        set $backend http://ai-backend:8000;
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /assets/ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /fontawesome/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
