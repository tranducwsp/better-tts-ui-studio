server {
    listen 5173;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml font/woff2;
    gzip_min_length 256;

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # Frontend and backend must be same-origin. The login session lives in HttpOnly cookies, so
    # calling the API on a different origin (VITE_API_URL) would trigger CORS + SameSite and the
    # cookie would be blocked. Therefore nginx proxies /api and /storage to the backend instead of
    # having the frontend call the absolute URL directly.
    #
    # Use Docker DNS resolver (127.0.0.11) instead of letting nginx resolve upstream ONCE at
    # startup. Without it, backend restart → gets a new IP on the network → nginx still holds the old IP
    # → every /api/* returns 502 "connection refused" until the frontend restarts.
    # valid=5s makes nginx re-query DNS periodically, picking up the new IP after ~5 seconds.
    resolver 127.0.0.11 valid=5s;

    location /api/ {
        set $backend http://ai-backend:8000;
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (/api/stream/tasks/{id}): progress must reach the browser as soon as the worker emits it.
        # With buffering on, nginx batches events and the progress bar freezes then jumps at the end.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /storage/ {
        set $backend http://ai-backend:8000;
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /assets/ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /fontawesome/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
