services:
  # 0. PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: app-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ai_studio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_studio"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 0.1 Redis Cache & PubSub Broker Service
  redis:
    image: redis:alpine
    container_name: app-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 1. AI Core Engine Microservice (Real AI Core TTS)
  core-engine:
    build:
      context: ./core-tts
      dockerfile: Dockerfile
    container_name: ai-core-engine
    ports:
      - "8001:8001"
    environment:
      - CORE_PORT=8001
      - CORE_HOST=0.0.0.0
    volumes:
      - ./core-tts:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    restart: unless-stopped

  # 2. Control Plane Web Backend (Go Chi - Auth, DB, Management, Dynamic Gateway)
  core-backend:
    build:
      context: ./core-backend
      dockerfile: Dockerfile
    container_name: ai-core-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/ai_studio?sslmode=disable
      - REDIS_URL=redis:6379
      - CORE_ENGINE_URL=http://core-engine:8001
      - CORE_ENGINE_GRPC_URL=core-engine:50051
    volumes:
      - ./core-backend/storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      core-engine:
        condition: service_started
    command: ./main
    restart: unless-stopped

  # 3. Frontend Web Studio (Static Nginx Production Build)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_UI_MODE=beauty
    container_name: ai-studio-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - core-backend
    restart: unless-stopped

volumes:
  postgres_data:
