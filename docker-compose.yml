services:
  # 0. PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: app-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD chưa được đặt trong .env}
      - POSTGRES_DB=${POSTGRES_DB:-ai_studio}
    # Không publish 5432 ra host: core-backend nói chuyện với Postgres qua network nội bộ của
    # compose theo tên service. Mở ra host là đưa cơ sở dữ liệu lên mọi giao diện mạng của máy.
    # Cần psql từ ngoài thì dùng `docker compose exec postgres psql`.
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_studio}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 0.1 Redis Cache & PubSub Broker Service
  redis:
    image: redis:alpine
    container_name: app-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD chưa được đặt trong .env}
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 1. AI Core Engine Microservice (Real AI Core TTS)
  core-engine:
    build:
      context: ./core-tts
      dockerfile: Dockerfile
    container_name: ai-core-engine
    # Engine không có lớp xác thực nào: mọi endpoint (/synthesize, /voices/clone) và cả gRPC
    # đều mở cho bất kỳ ai gọi được tới nó. Nó chỉ nên tiếp nhận traffic từ core-backend qua
    # network nội bộ, nên cổng không ra host.
    expose:
      - "8001"
      - "50051"
    environment:
      - CORE_PORT=8001
      - CORE_HOST=0.0.0.0
      # The engine owns the UI mode: it publishes this as ui_schema.ui_mode, the backend
      # forwards a rebuild webhook on manifest reload, and the frontend rebuilds against
      # the new value. "beauty" (default) or "fast" — the latter strips icons, webfonts
      # and GPU filters from the prerendered bundle.
      - UI_MODE=${UI_MODE:-beauty}
    volumes:
      - ./core-tts:/app
    # Không có --reload: nó theo dõi /app, mà /app là một bind mount từ host. Bất kỳ lỗi nào
    # cho phép ghi một tệp .py vào cây nguồn sẽ được uvicorn tự nạp — biến một lỗi ghi tệp
    # thành thực thi mã. Phát triển cục bộ thì thêm --reload trong compose override riêng.
    command: uvicorn main:app --host 0.0.0.0 --port 8001
    restart: unless-stopped

  # 2. Control Plane Web Backend (Go Chi - Auth, DB, Management, Dynamic Gateway)
  core-backend:
    build:
      context: ./core-backend
      dockerfile: Dockerfile
    container_name: ai-core-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY chưa được đặt trong .env}
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_studio}?sslmode=disable
      - REDIS_URL=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - COOKIE_SECURE=${COOKIE_SECURE:-0}

      # Tài khoản tạo sẵn ở lần khởi động đầu, khi cơ sở dữ liệu còn trống. Để trống cả bốn
      # thì không tài khoản nào được tạo và người dùng đầu tiên tự đăng ký qua giao diện.
      #
      # Trước đây compose không truyền chúng, mà image lại chứa sẵn một .env có tài khoản —
      # nên tài khoản được tạo là tài khoản của người dựng image, và đặt biến trong .env của
      # mình không có tác dụng gì.
      - DEFAULT_ADMIN_USERNAME=${DEFAULT_ADMIN_USERNAME:-}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-}
      - DEFAULT_USER_USERNAME=${DEFAULT_USER_USERNAME:-}
      - DEFAULT_USER_PASSWORD=${DEFAULT_USER_PASSWORD:-}
      - CORE_ENGINE_URL=http://core-engine:8001
      - CORE_ENGINE_GRPC_URL=core-engine:50051
      - FE_BUILDER_URL=http://frontend-builder:3001

      # Kho lưu trữ. Mặc định local để `docker compose up` chạy được ngay mà không cần tài
      # khoản nào; đặt STORAGE_BACKEND=s3 trong .env để chuyển sang MinIO/S3.
      #
      # Các biến S3_* truyền xuống vô điều kiện: khi backend chạy local nó không đọc chúng,
      # nên để trống là vô hại — còn khai chúng có điều kiện thì compose sẽ cần hai khối
      # environment và chúng sẽ trôi ra khỏi nhau.
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - STORAGE_DIR=/app/storage
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-0}
      - S3_PREFIX=${S3_PREFIX:-}

    # Ghim tên miền S3 về địa chỉ trong LAN, để traffic của SDK không đi qua Cloudflare.
    #
    # Container không dùng /etc/hosts của máy chủ: nó hỏi DNS công khai, nên một tên miền
    # đứng sau Cloudflare giải ra IP của Cloudflare thay vì máy chủ nội bộ.
    #
    # Đi qua proxy đó thì AWS SDK v2 nhận SignatureDoesNotMatch — lỗi do chính MinIO trả
    # (phản hồi có X-Amz-Request-Id), không phải Cloudflare chặn. Phạm vi hẹp hơn vẻ ngoài
    # của nó: mc, presigned URL, và một request tự ký với bộ header tối thiểu đều đi qua cùng
    # tên miền này bình thường — đã đo cả ba. Chỉ thao tác ký-bằng-header của SDK v2 là hỏng,
    # và backend dùng đúng SDK đó.
    #
    # Triệu chứng dễ đọc nhầm thành sai khoá hay thiếu quyền, vì đều là 403.
    #
    # Định dạng: "s3.example.com:192.168.1.100". Bỏ trống khi kho S3 vốn ở ngoài internet
    # (AWS thật, R2) — lúc đó đi qua DNS công khai mới đúng.
    extra_hosts:
      - "${S3_HOST_ENTRY:-s3.invalid:127.0.0.1}"

    volumes:
      - ./core-backend/storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      core-engine:
        condition: service_started
    command: ./main
    restart: unless-stopped

  # 3. Frontend Worker Builder (Node.js Sidecar for On-Demand Static HTML Re-prerendering)
  frontend-builder:
    build:
      context: ./frontend
      dockerfile: Dockerfile.builder
    container_name: ai-studio-frontend-builder
    # /rebuild không có xác thực và mỗi lần gọi là một lượt build tốn CPU, nên nó chỉ nhận
    # webhook từ core-backend trong network nội bộ.
    expose:
      - "3001"
    environment:
      - PORT=3001
      # Nửa còn lại của liên kết với FE_BUILDER_URL; xem core-backend/config/settings.go.
      - VITE_BACKEND_URL=${VITE_BACKEND_URL:-http://core-backend:8000}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./frontend/dist:/app/dist
    depends_on:
      - core-backend
    restart: unless-stopped

  # 4. Frontend Web Studio (High-performance Nginx serving from shared frontend_dist volume)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-studio-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
    depends_on:
      - core-backend
      - frontend-builder
    restart: unless-stopped

volumes:
  postgres_data:
  frontend_dist:
