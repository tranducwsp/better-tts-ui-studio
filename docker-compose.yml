version: '3.8'

services:
  # 1. AI Core TTS Microservice (Inference Engine)
  core-tts:
    build:
      context: ./core-tts
      dockerfile: Dockerfile
    container_name: vieneu-core-tts
    ports:
      - "8001:8001"
    environment:
      - CORE_PORT=8001
      - CORE_HOST=0.0.0.0
      - OMP_NUM_THREADS=2
    volumes:
      - ./core-tts:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    restart: unless-stopped

  # 2. Control Plane Web Backend (Auth, DB, Management, API Gateway Proxy)
  core-backend:
    build:
      context: ./core-backend
      dockerfile: Dockerfile
    container_name: vieneu-core-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - CORE_TTS_URL=http://core-tts:8001
    volumes:
      - ./core-backend:/app
    depends_on:
      - core-tts
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  # 3. Frontend Web Studio (Svelte 5 Dev Server with Hot Module Replacement)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vieneu-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - core-backend
    command: npm run dev -- --host 0.0.0.0
    restart: unless-stopped
