version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: core-backend-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=vieneu_tts
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vieneu_tts"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  core-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: core-backend-api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/vieneu_tts?sslmode=disable
      - CORE_TTS_URL=http://host.docker.internal:8001
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    command: ./main
    restart: unless-stopped

volumes:
  postgres_data:
