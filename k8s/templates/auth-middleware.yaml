apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "better-tts-studio.fullname" . }}-auth
  namespace: {{ .Values.namespace | default "vieneu-studio" }}
  labels:
    app.kubernetes.io/name: {{ include "better-tts-studio.name" . }}
    helm.sh/chart: {{ include "better-tts-studio.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  basicAuth:
    secret: vieneu-studio-secret
