apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ui-studio.fullname" . }}-worker
  namespace: {{ .Values.namespace | default "ui-studio" }}
  labels:
    app.kubernetes.io/name: {{ include "ui-studio.name" . }}-worker
    helm.sh/chart: {{ include "ui-studio.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ui-studio.name" . }}-worker
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ui-studio.name" . }}-worker
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          command: ["./worker"]
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ui-studio.fullname" . }}-secret
                  key: secretKey
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "ui-studio.fullname" . }}-secret
                  key: databaseUrl
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "ui-studio.fullname" . }}-secret
                  key: redisUrl
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ui-studio.fullname" . }}-secret
                  key: redisPassword
            - name: CORE_ENGINE_URL
              value: "http://{{ include "ui-studio.fullname" . }}-engine:{{ .Values.engine.service.httpPort }}"
            - name: CORE_ENGINE_GRPC_URL
              value: "{{ include "ui-studio.fullname" . }}-engine:{{ .Values.engine.service.grpcPort }}"
            - name: STORAGE_BACKEND
              value: {{ .Values.persistence.enabled | ternary "local" "s3" | quote }}
            - name: STORAGE_DIR
              value: {{ .Values.persistence.mountPath | quote }}
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: {{ include "ui-studio.fullname" . }}-secret
                  key: s3Bucket
                  optional: true
            - name: S3_REGION
              valueFrom:
                secretKeyRef:
                  name: {{ include "ui-studio.fullname" . }}-secret
                  key: s3Region
                  optional: true
            - name: S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ include "ui-studio.fullname" . }}-secret
                  key: s3Endpoint
                  optional: true
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "ui-studio.fullname" . }}-secret
                  key: s3AccessKeyId
                  optional: true
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ui-studio.fullname" . }}-secret
                  key: s3SecretAccessKey
                  optional: true
            - name: S3_FORCE_PATH_STYLE
              valueFrom:
                secretKeyRef:
                  name: {{ include "ui-studio.fullname" . }}-secret
                  key: s3ForcePathStyle
                  optional: true
            - name: S3_PREFIX
              valueFrom:
                secretKeyRef:
                  name: {{ include "ui-studio.fullname" . }}-secret
                  key: s3Prefix
                  optional: true
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: storage-volume
              mountPath: {{ .Values.persistence.mountPath }}
          {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: storage-volume
          persistentVolumeClaim:
            claimName: {{ include "ui-studio.fullname" . }}-pvc
      {{- end }}
